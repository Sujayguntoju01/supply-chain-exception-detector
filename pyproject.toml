[project]
name = "supply-chain-exception-detector"
version = "1.0.0"
description = "Flags late shipments and order exceptions in supply chain data, served as a FastAPI service on AWS."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
