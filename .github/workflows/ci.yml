name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Train on synthetic sample so the image has a model
        run: |
          pip install -r requirements.txt
          python scripts/make_sample_data.py --rows 3000 --out data/sample_orders.csv
          PYTHONPATH=src python -m supply_chain.train --data data/sample_orders.csv
      - name: Build image
        run: docker build -t supply-chain-exception-detector .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 supply-chain-exception-detector
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
